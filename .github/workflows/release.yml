name: Release

# Cross-platform releases are built from an existing annotated tag through a
# manual dispatch. The local script remains a Windows-only recovery lane.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to build and publish
        required: true
        type: string
      publish_release:
        description: Publish after every platform passes (otherwise verify and retain artifacts only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: immutable-releases-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  NPM_VERSION: "11.10.1"
  RUST_VERSION: "1.96.1"
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  preflight:
    name: Preflight - Release contract
    runs-on: ubuntu-22.04
    outputs:
      tag_commit: ${{ steps.release_target.outputs.tag_commit }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require updater signing credentials
        if: inputs.publish_release
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing updater signing secret: TAURI_SIGNING_PRIVATE_KEY'
          }

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch annotated release tag
        shell: pwsh
        run: git fetch --force origin "refs/tags/${env:RELEASE_TAG}:refs/tags/${env:RELEASE_TAG}"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Pin npm
        shell: pwsh
        run: |
          npm install --global "npm@$env:NPM_VERSION"
          if ((npm --version).Trim() -ne $env:NPM_VERSION) { throw "Unexpected npm version" }

      - name: Validate annotated release target
        id: release_target
        shell: pwsh
        run: |
          $tagCommit = (git rev-list -n 1 "$env:RELEASE_TAG").Trim()
          ./scripts/check-release-contract.ps1 -Tag "$env:RELEASE_TAG" -ExpectedCommit $tagCommit
          "tag_commit=$tagCommit" >> $env:GITHUB_OUTPUT

      - name: Verify vendored Codex integrity
        shell: pwsh
        run: ./scripts/check-codex-rich-presence-upstream.ps1

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        shell: pwsh
        run: ./scripts/audit-rust.ps1

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Svelte and TypeScript
        working-directory: frontend
        run: npm run check

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 0

      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked --workspace

      - name: Build Rust workspace
        run: cargo build --locked --workspace --all-targets

  build:
    name: Build - ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - label: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis,msi
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - label: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.tag_commit }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: clippy

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Pin npm
        shell: pwsh
        run: |
          npm install --global "npm@$env:NPM_VERSION"
          if ((npm --version).Trim() -ne $env:NPM_VERSION) { throw "Unexpected npm version" }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Verify native platform
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $hostLine = rustc -vV | Select-String '^host: '
          if ($LASTEXITCODE -ne 0 -or -not $hostLine) { throw 'Cannot identify Rust host' }
          $hostTarget = $hostLine.ToString().Substring(6).Trim()
          if ($hostTarget -ne $env:TARGET) { throw "Expected native $env:TARGET runner, got $hostTarget" }
          cargo clippy --locked --workspace --all-targets --target "$env:TARGET" -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Native clippy failed' }
          cargo test --locked --workspace --target "$env:TARGET"
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }

      - name: Prepare bundle arguments
        id: bundle_args
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          $arguments = "--target $env:TARGET --bundles $env:BUNDLES"
          if ($env:PUBLISH_RELEASE -ne 'true') {
            New-Item -ItemType Directory -Force src-tauri/.build | Out-Null
            '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Encoding utf8 src-tauri/.build/platform-verification.json
            $arguments += ' --config .build/platform-verification.json'
          }
          "args=$arguments -- --locked" >> $env:GITHUB_OUTPUT

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Verification artifacts are not release or updater candidates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.publish_release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.publish_release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          projectPath: src-tauri
          args: ${{ steps.bundle_args.outputs.args }}

      - name: Verify macOS package architecture
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app="target/$TARGET/release/bundle/macos/Pulse.app"
          test -d "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          arch=x86_64
          if [[ "$TARGET" == aarch64-* ]]; then arch=arm64; fi
          lipo "$app/Contents/MacOS/$executable" -verify_arch "$arch"
          echo 'GitHub macOS packages have no Apple Developer ID signature or notarization.' >> "$GITHUB_STEP_SUMMARY"

      - name: Collect complete platform artifact set
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.label }}
          TARGET: ${{ matrix.target }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          $candidates = @(
            "target/$env:TARGET/release/bundle",
            "target/release/bundle",
            "src-tauri/target/$env:TARGET/release/bundle",
            "src-tauri/target/release/bundle"
          )
          $bundle = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Select-Object -First 1
          if (-not $bundle) { throw "No release assets bundle directory found for $env:PLATFORM" }
          $verificationOnly = $env:PUBLISH_RELEASE -ne 'true'
          ./scripts/release-platform-assets.ps1 -InputDirectory $bundle -OutputDirectory dist -Platform $env:PLATFORM -VerificationOnly:$verificationOnly

      - name: Generate and verify Windows SPDX SBOM
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.label }}
        run: |
          $artifact = @(Get-ChildItem -LiteralPath dist -File -Filter *.exe)
          if ($artifact.Count -ne 1) { throw "Expected exactly one Windows executable, found $($artifact.Count)" }
          $version = [string](Get-Content -Raw package.json | ConvertFrom-Json).version
          $sbom = "dist/pulse-$env:PLATFORM.spdx.json"
          ./scripts/new-windows-sbom.ps1 -ArtifactPath $artifact[0].FullName -OutputPath $sbom -PackageName pulse -PackageVersion $version
          ./scripts/check-windows-sbom.ps1 -ArtifactPath $artifact[0].FullName -SbomPath $sbom -PackageName pulse -PackageVersion $version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pulse-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 0

  publish:
    name: Publish immutable release
    if: inputs.publish_release
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.tag_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate immutable release target
        shell: pwsh
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.tag_commit }}
        run: |
          git fetch --force origin "refs/tags/${env:RELEASE_TAG}:refs/tags/${env:RELEASE_TAG}"
          $tagCommit = (git rev-list -n 1 "$env:RELEASE_TAG").Trim()
          if ($tagCommit -ne $env:EXPECTED_TAG_COMMIT) {
            throw "Release tag moved after preflight: expected $env:EXPECTED_TAG_COMMIT, got $tagCommit"
          }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          pattern: pulse-*

      - name: Prepare complete release assets and checksums
        shell: pwsh
        run: ./scripts/release-assets.ps1 -ArtifactsDirectory artifacts -OutputDirectory release-assets -Tag "$env:RELEASE_TAG" -Repository "$env:GITHUB_REPOSITORY"

      - name: Verify checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 24
          test "$(wc -l < release-assets/SHA256SUMS.txt)" -eq 23
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: Verify updater manifest targets every platform
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(jq -r .version release-assets/latest.json)" = "${TAG#v}"
          for target in windows-x86_64 windows-aarch64 darwin-aarch64 darwin-x86_64 linux-x86_64 linux-aarch64; do
            url="$(jq -r --arg t "$target" '.platforms[$t].url' release-assets/latest.json)"
            signature="$(jq -r --arg t "$target" '.platforms[$t].signature' release-assets/latest.json)"
            test -n "$signature" && test "$signature" != "null"
            test -f "release-assets/$(basename "$url")"
          done

      - name: Extract curated release notes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/extract-changelog-section.py "${TAG#v}" CHANGELOG.md > release-body.md
          test -s release-body.md
          test "$(wc -c < release-body.md)" -ge 80

      - name: Publish verified immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable releases are never updated" >&2
            exit 1
          fi

          finalized=false
          cleanup_draft() {
            if [[ "$finalized" != "true" ]] && [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" == "true" ]]; then
              gh release delete "$TAG" --yes
            fi
          }
          trap cleanup_draft EXIT INT TERM

          release_flags=(--draft --verify-tag --title "Pulse $TAG" --notes-file release-body.md)
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          gh release create "$TAG" release-assets/* "${release_flags[@]}"

          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt

          mkdir verified-assets
          gh release download "$TAG" --dir verified-assets
          (cd verified-assets && sha256sum --check SHA256SUMS.txt)

          release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate \
            --jq '.[] | [.name, .digest] | @tsv' | sort > remote-assets.tsv
          while IFS= read -r local_path; do
            asset_name="$(basename "$local_path")"
            expected_digest="sha256:$(sha256sum "$local_path" | cut -d' ' -f1)"
            actual_digest="$(awk -F '\t' -v name="$asset_name" '$1 == name { print $2 }' remote-assets.tsv)"
            test "$actual_digest" = "$expected_digest"
          done < <(find release-assets -maxdepth 1 -type f | sort)

          gh release edit "$TAG" --draft=false
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .immutable)" = "true"
          finalized=true
