name: Release

# Cross-platform releases are built from an existing annotated tag through a
# manual dispatch. scripts/release-local.ps1 remains a Windows-only recovery lane.
# Every release step beyond plain git, bun and cargo is a `cargo xtask` command, so
# the same code runs on all six runners without PowerShell.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to build and publish
        required: true
        type: string
      publish_release:
        description: Publish after every platform passes (otherwise verify and retain artifacts only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: immutable-releases-${{ github.repository }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The repository's .cargo/config.toml links with mold on Linux x64; hosted runners do
  # not have it, and this variable replaces the target rustflags.
  RUSTFLAGS: ""
  BUN_VERSION: "1.4.4"
  RUST_VERSION: "1.99.1"
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  preflight:
    name: Preflight - Release contract
    runs-on: ubuntu-22.04
    outputs:
      tag_commit: ${{ steps.release_target.outputs.tag_commit }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require updater signing credentials
        if: inputs.publish_release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "Missing updater signing secret: TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch annotated release tag
        run: git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Validate annotated release target
        id: release_target
        run: |
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          cargo xtask release-contract --tag "$RELEASE_TAG" --expected-commit "$tag_commit"
          echo "tag_commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Verify vendored Codex integrity
        run: cargo xtask upstream check

      - name: Check changelog and llms.txt
        run: |
          cargo xtask changelog check
          cargo xtask llms --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo xtask audit

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: bun run typecheck

      - name: Test frontend
        run: bun run test

      - name: Build frontend
        run: bun run build:frontend

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 0

      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked --workspace

      - name: Build Rust workspace
        run: cargo build --locked --workspace --all-targets

  build:
    name: Build - ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - label: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis,msi
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - label: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.tag_commit }}
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Installs the pinned Tauri CLI that tauri-action runs through `bunx tauri`.
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: frontend-dist
          path: frontend/dist

      # The build job runs on Windows, macOS and Linux with each runner's default shell,
      # so its commands take matrix values through ${{ }} instead of shell variables.
      - name: Verify native platform
        run: cargo xtask verify-native --target ${{ matrix.target }}

      - name: Prepare bundle arguments
        id: bundle_args
        run: cargo xtask bundle-args --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}" --publish ${{ inputs.publish_release }}

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Verification artifacts are not release or updater candidates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.publish_release && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.publish_release && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          projectPath: src-tauri
          tauriScript: bunx tauri
          args: ${{ steps.bundle_args.outputs.args }}

      - name: Verify macOS package architecture
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app="target/$TARGET/release/bundle/macos/Pulse.app"
          test -d "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          arch=x86_64
          if [[ "$TARGET" == aarch64-* ]]; then arch=arm64; fi
          lipo "$app/Contents/MacOS/$executable" -verify_arch "$arch"
          echo 'GitHub macOS packages have no Apple Developer ID signature or notarization.' >> "$GITHUB_STEP_SUMMARY"

      - name: Collect complete platform artifact set
        run: >
          cargo xtask platform-assets
          --input "target/${{ matrix.target }}/release/bundle"
          --input target/release/bundle
          --input "src-tauri/target/${{ matrix.target }}/release/bundle"
          --input src-tauri/target/release/bundle
          --output dist
          --platform ${{ matrix.label }}
          --verification-only ${{ !inputs.publish_release }}

      - name: Generate and verify Windows SPDX SBOM
        if: runner.os == 'Windows'
        run: cargo xtask sbom ci --dist dist --platform ${{ matrix.label }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pulse-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 0

  publish:
    name: Publish immutable release
    if: inputs.publish_release
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.preflight.outputs.tag_commit }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Revalidate immutable release target
        env:
          EXPECTED_TAG_COMMIT: ${{ needs.preflight.outputs.tag_commit }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$tag_commit" != "$EXPECTED_TAG_COMMIT" ]; then
            echo "Release tag moved after preflight: expected $EXPECTED_TAG_COMMIT, got $tag_commit" >&2
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: artifacts
          pattern: pulse-*

      - name: Prepare complete release assets and checksums
        run: cargo xtask release-assets --artifacts artifacts --output release-assets --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"

      - name: Verify checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 24
          test "$(wc -l < release-assets/SHA256SUMS.txt)" -eq 23
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: Verify updater manifest targets every platform
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(jq -r .version release-assets/latest.json)" = "${TAG#v}"
          for target in windows-x86_64 windows-aarch64 darwin-aarch64 darwin-x86_64 linux-x86_64 linux-aarch64; do
            url="$(jq -r --arg t "$target" '.platforms[$t].url' release-assets/latest.json)"
            signature="$(jq -r --arg t "$target" '.platforms[$t].signature' release-assets/latest.json)"
            test -n "$signature" && test "$signature" != "null"
            test -f "release-assets/$(basename "$url")"
          done

      - name: Extract curated release notes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cargo xtask changelog notes "${TAG#v}" --output release-body.md
          test -s release-body.md
          test "$(wc -c < release-body.md)" -ge 80

      - name: Publish verified immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; immutable releases are never updated" >&2
            exit 1
          fi

          finalized=false
          cleanup_draft() {
            if [[ "$finalized" != "true" ]] && [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)" == "true" ]]; then
              gh release delete "$TAG" --yes
            fi
          }
          trap cleanup_draft EXIT INT TERM

          release_flags=(--draft --verify-tag --title "Pulse ${TAG#v}" --notes-file release-body.md)
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          gh release create "$TAG" release-assets/* "${release_flags[@]}"

          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          diff -u expected-assets.txt actual-assets.txt

          mkdir verified-assets
          gh release download "$TAG" --dir verified-assets
          (cd verified-assets && sha256sum --check SHA256SUMS.txt)

          release_id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --paginate \
            --jq '.[] | [.name, .digest] | @tsv' | sort > remote-assets.tsv
          while IFS= read -r local_path; do
            asset_name="$(basename "$local_path")"
            expected_digest="sha256:$(sha256sum "$local_path" | cut -d' ' -f1)"
            actual_digest="$(awk -F '\t' -v name="$asset_name" '$1 == name { print $2 }' remote-assets.tsv)"
            test "$actual_digest" = "$expected_digest"
          done < <(find release-assets -maxdepth 1 -type f | sort)

          gh release edit "$TAG" --draft=false
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .immutable)" = "true"
          finalized=true
