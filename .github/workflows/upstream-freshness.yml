name: Codex upstream freshness

# Manual-only so scheduled runs never consume Actions minutes. Trigger it from the
# Actions tab when an upstream check is wanted.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-upstream-freshness
  cancel-in-progress: false

env:
  RUST_VERSION: "1.99.1"
  # Hosted runners have no mold; this replaces the linker flag in .cargo/config.toml.
  RUSTFLAGS: ""

jobs:
  reconcile:
    name: Reconcile upstream drift issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Open, update, or close the single drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask upstream freshness
