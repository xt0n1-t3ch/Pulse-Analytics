[package]
name = "pulse"
version = "2.1.0"
edition = "2024"
description = "Pulse - local-first analytics for Claude Code, Codex, OpenCode, Command Code and Orion App"
default-run = "pulse"
license = "Apache-2.0"
repository = "https://github.com/xt0n1-t3ch/Pulse-Analytics"
homepage = "https://github.com/xt0n1-t3ch/Pulse-Analytics"
authors = ["xt0n1-t3ch"]

[dependencies]
anyhow.workspace = true
cc-discord-presence = { path = ".." }
chrono.workspace = true
codex-presence-core.workspace = true
dirs.workspace = true
fs2.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-shell = "2.6.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
tempfile.workspace = true
tracing.workspace = true
ureq = { workspace = true, features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
