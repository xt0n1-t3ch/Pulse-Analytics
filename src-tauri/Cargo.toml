[package]
name = "pulse"
version = "1.9.4"
edition = "2024"
description = "Pulse - Claude Code, Codex and OpenCode analytics"
default-run = "pulse"
license = "Apache-2.0"
repository = "https://github.com/xt0n1-t3ch/Pulse-Analytics"
homepage = "https://github.com/xt0n1-t3ch/Pulse-Analytics"
authors = ["xt0n1-t3ch"]

[dependencies]
cc-discord-presence = { path = ".." }
codex-presence-core = { git = "https://github.com/xt0n1-t3ch/Codex-Discord-Rich-Presence", rev = "0caece60a71eb657d7b829e3b6c7c4896a0a536c", version = "2.0.1" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
fs2 = "0.4.3"
dirs = "6.0.0"
tempfile = "3.23.0"
ureq = { version = "2.12.1", default-features = true, features = ["json"] }

[dev-dependencies]
tempfile = "3.23.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
